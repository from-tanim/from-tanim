<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanım Hossain - Co-Curricular & Leadership Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">
    <div id="root"></div>

    <!-- React Dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const activitiesData = [
            {
                id: "psa",
                category: "Scouts & Leadership",
                title: "Bangladesh Scouts President's Scout Award",
                featured: true,
                badge: "Highest Honor",
                description: "Recognized with the premier national award for exceptional leadership, community service, and personal development in Scouting.",
                details: "Participated in rigorous physical, intellectual, and ethical challenges across health, peacebuilding, and survival skills over multiple years. Led patrol teams during community development drives.",
                skills: ["Team Leadership", "Crisis Management", "Ethics & Governance", "Public Service"],
                meta: { Organization: "Bangladesh Scouts", Date: "March 2023", Level: "National" }
            },
            {
                id: "jota",
                category: "Scouts & Leadership",
                title: "Jamboree on the Internet (JOTA-JOTI)",
                featured: false,
                badge: "International",
                description: "Engaged in a global digital rally, connecting with scouts worldwide to solve challenges focused on Sustainable Development Goals (SDGs).",
                details: "Collaborated in cross-cultural workshops on digital citizenship, peace education, and global connectivity, honing international cross-team communication.",
                skills: ["Cross-Cultural Communication", "SDGs Alignment", "Remote Collaboration"],
                meta: { Organization: "WOSM", Date: "Oct 2021 & 2022", Scope: "Global" }
            },
            {
                id: "bask",
                category: "Sports & Athletics",
                title: "51st Winter National Sports - Basketball",
                featured: true,
                badge: "District Champion",
                description: "Captain of the district champion basketball team, driving tactical gameplay and squad coordination.",
                details: "Organized training drills, analyzed opponent tactics, and maintained squad morale through high-pressure knockout rounds to secure the championship trophy.",
                skills: ["Team Captaincy", "High-Pressure Execution", "Tactical Strategy", "Athleticism"],
                meta: { Role: "Team Captain", Institute: "Sports Club of Kishaloya Adarsha", Date: "2023" }
            },
            {
                id: "pihacks",
                category: "Hackathons & Tech",
                title: "PIHACKS '21 Hackathon",
                featured: false,
                badge: "Competitor",
                description: "Collaborated under intense time constraints to pitch and prototype tech-driven solutions for community challenges.",
                details: "Brainstormed software/hardware architectures, developed functional logic, and delivered a quick presentation pitch to judges.",
                skills: ["Rapid Prototyping", "Problem Solving", "Pitching", "Agile Collaboration"],
                meta: { Organization: "Presidency International School", Date: "July 2021" }
            },
            {
                id: "cyber",
                category: "Scouts & Leadership",
                title: "Be Safe Online & Cyber Safety Olympiad",
                featured: false,
                badge: "Certification",
                description: "Achieved perfect marks in cyber safety certification and completed a 20-round national quiz series on digital ethics.",
                details: "Focused on cybersecurity awareness, combatting online extremism, data privacy, and responsible internet navigation.",
                skills: ["Cyber Security", "Digital Hygiene", "Information Ethics"],
                meta: { Organization: "WOSM & USAID Obiroidh", Date: "2020 - 2021" }
            },
            {
                id: "photo",
                category: "Creative & Media",
                title: "Photographer Badge Course",
                featured: false,
                badge: "Creative",
                description: "Completed specialized training in visual story-telling, field photography, and digital media production.",
                details: "Mastered manual camera controls, composition framing, and photojournalism techniques to document community service events.",
                skills: ["Visual Communications", "Photography", "Media Production"],
                meta: { Organization: "Bangladesh Scouts Program Div.", Date: "July 2020" }
            }
        ];

        const App = () => {
            const [selectedCategory, setSelectedCategory] = React.useState("All");
            const [searchQuery, setSearchQuery] = React.useState("");
            const [activeModal, setActiveModal] = React.useState(null);

            const categories = ["All", "Scouts & Leadership", "Sports & Athletics", "Hackathons & Tech", "Creative & Media"];

            const filteredActivities = activitiesData.filter(act => {
                const matchesCategory = selectedCategory === "All" || act.category === selectedCategory;
                const matchesSearch = act.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     act.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                     act.skills.some(s => s.toLowerCase().includes(searchQuery.toLowerCase()));
                return matchesCategory && matchesSearch;
            });

            return (
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                    
                    <!-- Hero Section -->
                    <header className="text-center mb-12">
                        <div className="inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full mb-3 uppercase tracking-wider">
                            Interactive Portfolio
                        </div>
                        <h1 className="text-4xl sm:text-6xl font-black text-slate-900 tracking-tight mb-3">
                            Tanım Hossain
                        </h1>
                        <p className="text-lg sm:text-xl text-slate-600 max-w-2xl mx-auto font-normal">
                            Co-Curricular Achievements, Leadership Milestones, & Technical Engagements
                        </p>
                    </header>

                    <!-- Key Impact Metrics Banner -->
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <span className="block text-3xl font-extrabold text-blue-600">1+</span>
                            <span className="text-xs font-medium text-slate-500 uppercase tracking-wider">President's Scout Award</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <span className="block text-3xl font-extrabold text-emerald-600">Captain</span>
                            <span className="text-xs font-medium text-slate-500 uppercase tracking-wider">District Champion Team</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <span className="block text-3xl font-extrabold text-indigo-600">Global</span>
                            <span className="text-xs font-medium text-slate-500 uppercase tracking-wider">JOTA-JOTI Contributor</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <span className="block text-3xl font-extrabold text-purple-600">10+</span>
                            <span className="text-xs font-medium text-slate-500 uppercase tracking-wider">Certifications & Badges</span>
                        </div>
                    </div>

                    <!-- Filter & Search Controls -->
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <!-- Category Buttons -->
                        <div className="flex flex-wrap justify-center md:justify-start gap-1.5 w-full md:w-auto">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setSelectedCategory(cat)}
                                    className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                                        selectedCategory === cat
                                            ? "bg-slate-900 text-white shadow-sm"
                                            : "text-slate-600 hover:bg-slate-100"
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        <!-- Search Bar -->
                        <div className="w-full md:w-64">
                            <input
                                type="text"
                                placeholder="Search activity or skill..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full bg-slate-100 border border-slate-200 rounded-xl px-3.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                            />
                        </div>
                    </div>

                    <!-- Cards Grid -->
                    <main className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredActivities.map((act) => (
                            <div 
                                key={act.id} 
                                onClick={() => setActiveModal(act)}
                                className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all cursor-pointer flex flex-col justify-between group"
                            >
                                <div>
                                    <div className="flex justify-between items-start mb-3">
                                        <span className="text-[10px] uppercase tracking-wider font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">
                                            {act.category}
                                        </span>
                                        <span className="text-[10px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
                                            {act.badge}
                                        </span>
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-900 group-hover:text-blue-600 transition-colors mb-2">
                                        {act.title}
                                    </h3>
                                    <p className="text-slate-600 text-xs leading-relaxed mb-4">
                                        {act.description}
                                    </p>
                                </div>

                                <div>
                                    <!-- Skill Badges -->
                                    <div className="flex flex-wrap gap-1 mb-4">
                                        {act.skills.slice(0, 3).map((skill, i) => (
                                            <span key={i} className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">
                                                {skill}
                                            </span>
                                        ))}
                                    </div>

                                    <div className="pt-3 border-t border-slate-100 flex justify-between items-center text-[11px] text-slate-400 font-medium">
                                        <span>{act.meta.Organization || act.meta.Institute || "Event"}</span>
                                        <span className="text-blue-600 font-semibold group-hover:translate-x-1 transition-transform inline-block">View details &rarr;</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </main>

                    {filteredActivities.length === 0 && (
                        <div className="text-center py-12 text-slate-400 text-sm">
                            No activities match your search query or filter.
                        </div>
                    )}

                    <!-- Modal Popup -->
                    {activeModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 border border-slate-200 shadow-xl relative animate-in fade-in zoom-in duration-150">
                                <button 
                                    onClick={() => setActiveModal(null)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-lg p-1"
                                >
                                    ✕
                                </button>
                                
                                <span className="text-[10px] uppercase tracking-wider font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">
                                    {activeModal.category}
                                </span>

                                <h2 className="text-xl font-bold text-slate-900 mt-2 mb-1">{activeModal.title}</h2>
                                <p className="text-xs text-slate-500 font-medium mb-4">{activeModal.meta.Organization || activeModal.meta.Institute} • {activeModal.meta.Date}</p>

                                <div className="space-y-4 text-xs text-slate-600 leading-relaxed">
                                    <div>
                                        <h4 className="font-semibold text-slate-800 uppercase tracking-wider text-[10px] mb-1">Key Impact & Details</h4>
                                        <p>{activeModal.details}</p>
                                    </div>

                                    <div>
                                        <h4 className="font-semibold text-slate-800 uppercase tracking-wider text-[10px] mb-1">Competencies Developed</h4>
                                        <div className="flex flex-wrap gap-1.5 mt-1">
                                            {activeModal.skills.map((skill, idx) => (
                                                <span key={idx} className="bg-blue-50 text-blue-700 px-2.5 py-1 rounded-md font-semibold text-[10px]">
                                                    {skill}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setActiveModal(null)}
                                    className="w-full mt-6 bg-slate-900 text-white font-medium text-xs py-2.5 rounded-xl hover:bg-slate-800 transition-colors"
                                >
                                    Close Window
                                </button>
                            </div>
                        </div>
                    )}

                    <!-- Footer -->
                    <footer className="mt-20 border-t border-slate-200 pt-8 text-center text-xs text-slate-400">
                        <p>© {new Date().getFullYear()} Tanım Hossain. Built with React & Tailwind CSS.</p>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
